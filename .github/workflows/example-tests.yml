name: Example Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples-linux:
    name: Example Suite (Ubuntu latest, Bun latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install test browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: Build compiler
        run: bun run build

      - name: Run full test suite
        run: bun run test

  examples-macos:
    name: Example Suite (macOS latest, Bun latest)
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install test browsers
        run: bunx playwright install chromium webkit

      - name: Build compiler
        run: bun run build

      - name: Run full test suite
        run: bun run test
