name: TypeScript ABI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bindings:
    name: Bindings (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Verify generated browser declarations
        run: |
          node -e '
            import fs from "node:fs";
            import { gunzipSync } from "node:zlib";
            const mod = await import("./src/bindings/browser-catalog.generated.js");
            fs.writeFileSync("/tmp/browser-before.json", gunzipSync(Buffer.from(mod.BROWSER_ABI_GZIP, "base64")));
            fs.writeFileSync("/tmp/worker-before.json", gunzipSync(Buffer.from(mod.WORKER_ABI_GZIP, "base64")));
          '
          bun run bindings:browser
          bun run build
          node -e '
            import fs from "node:fs";
            import { gunzipSync } from "node:zlib";
            const mod = await import(`./src/bindings/browser-catalog.generated.js?after=${Date.now()}`);
            const browserAfter = gunzipSync(Buffer.from(mod.BROWSER_ABI_GZIP, "base64"));
            const workerAfter = gunzipSync(Buffer.from(mod.WORKER_ABI_GZIP, "base64"));
            if (!browserAfter.equals(fs.readFileSync("/tmp/browser-before.json"))) {
              console.error("BROWSER_ABI_GZIP JSON differs from checked-in browser-catalog.generated.js");
              process.exit(1);
            }
            if (!workerAfter.equals(fs.readFileSync("/tmp/worker-before.json"))) {
              console.error("WORKER_ABI_GZIP JSON differs from checked-in browser-catalog.generated.js");
              process.exit(1);
            }
          '
          git diff --exit-code -- src/selfhost/platform-sources.generated.js
      - name: Node ABI coverage
        run: |
          node scripts/dts-abi-tests.mjs
          node scripts/dts-deep-tests.mjs
      - name: Bun ABI coverage
        run: |
          bun scripts/dts-abi-tests.mjs
          bun scripts/dts-deep-tests.mjs
      - name: Install test browser
        run: bunx playwright install --with-deps chromium
      - name: Worker portability and browser app
        run: |
          node scripts/test-dts-portability.mjs
          node scripts/test-dts-browser.mjs
          node scripts/test-browser-pantry.mjs
      - name: Save measured output and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-demo-${{ matrix.os }}
          path: |
            dist/browser-board/sizes.json
            dist/browser-board/*.png
            dist/browser-pantry/*.png
