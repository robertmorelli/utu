name: Tooling Matrix

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling-linux:
    name: Tooling (Ubuntu latest, Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Reject runtime dependencies
        run: node -e 'const d=require("./package.json").dependencies||{}; if(Object.keys(d).length){console.error("Runtime deps not allowed:",d); process.exit(1)}'

      - name: Install test browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: Build everything
        run: bun run build

      - name: Run bundle smoke test
        run: bun run test:bundle

      - name: Run full test suite
        run: bun run test

      - name: Package VS Code extension
        run: bun run package:vscode

  tooling-macos:
    name: Tooling (macOS latest, Node 24)
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Reject runtime dependencies
        run: node -e 'const d=require("./package.json").dependencies||{}; if(Object.keys(d).length){console.error("Runtime deps not allowed:",d); process.exit(1)}'

      - name: Install test browsers
        run: bunx playwright install chromium webkit

      - name: Build everything
        run: bun run build

      - name: Run bundle smoke test
        run: bun run test:bundle

      - name: Run full test suite
        run: bun run test

      - name: Package VS Code extension
        run: bun run package:vscode
